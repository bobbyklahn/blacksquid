# Black Squid Distillery — CMS configuration (Sveltia CMS, Decap-compatible)
#
# TWO VALUES TO SET BEFORE FIRST LOGIN (see DEPLOY.md step 5):
#   1. backend.repo      — your GitHub username/repo
#   2. backend.base_url  — your deployed sveltia-cms-auth worker URL

backend:
  name: github
  repo: bobbyklahn/blacksquid
  branch: main
  base_url: https://sveltia-cms-auth.bobbyleo.workers.dev

site_url: https://www.blacksquiddistillery.com.au
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: spirits
    label: Spirits (Gins)
    label_singular: Spirit
    folder: src/content/spirits
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — A${{price}}'
    fields:
      - { name: title, label: Name, widget: string, hint: 'e.g. Klahn Shiraz Gin' }
      - name: range
        label: Range
        widget: select
        options:
          - { label: 'Klahn Estate', value: klahn }
          - { label: 'Black Squid', value: black-squid }
      - { name: style, label: Style, widget: string, required: false, hint: 'e.g. Shiraz Gin, London Dry Gin' }
      - { name: price, label: 'Price (AUD)', widget: number, value_type: float, min: 0 }
      - { name: salePrice, label: 'Sale price (AUD, optional)', widget: number, value_type: float, required: false, hint: 'Leave empty for no sale. Checkout charges this when set.' }
      - { name: abv, label: ABV, widget: string, required: false, hint: 'e.g. 40%' }
      - { name: volume, label: Volume, widget: string, required: false, hint: 'e.g. 700ml' }
      - { name: soldOut, label: 'Sold out', widget: boolean, default: false }
      - { name: featured, label: 'Feature on homepage', widget: boolean, default: false }
      - { name: order, label: 'Sort order (low = first)', widget: number, value_type: int, default: 50 }
      - name: components
        label: 'Bundle contents (optional)'
        widget: relation
        collection: spirits
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        hint: "Pick the bottles inside to make this a gift bundle — the page auto-shows what's inside and the saving vs buying separately. Leave empty for a normal product. Set this product's own Price/Sale price to what the bundle should charge."
      - { name: description, label: Description, widget: text, hint: 'Blank line between paragraphs.' }
      - { name: serve, label: 'Serve suggestion', widget: string, required: false }
      - name: images
        label: Photos
        widget: list
        field: { name: image, label: Image, widget: image }
        hint: 'First photo is the main one. Uploads land in /images/uploads.'

  - name: bottles
    label: SPAK — Bottles & Closures
    label_singular: SKU
    folder: src/content/bottles
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — A${{price}} ea'
    fields:
      - { name: title, label: Product name, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Bottle, value: bottle }
          - { label: 'Closure (cap / cork)', value: closure }
      - { name: price, label: 'Unit price (AUD)', widget: number, value_type: float, min: 0 }
      - { name: priceFrom, label: '"From" pricing (quantity breaks)', widget: boolean, default: false }
      - { name: note, label: Note, widget: string, required: false }
      - { name: order, label: 'Sort order', widget: number, value_type: int, default: 50 }
      - { name: image, label: Photo, widget: image, required: false }

  - name: journal
    label: Journal
    label_singular: Post
    folder: src/content/journal
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: excerpt, label: Excerpt, widget: string, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }
